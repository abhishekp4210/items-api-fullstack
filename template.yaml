AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Items API - HTTP API + Lambda (Python 3.12) + DynamoDB

Parameters:
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel

Resources:
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      # Least privilege: only the two actions the code uses, on this table only
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt ItemsTable.Arn
      Events:
        CreateItem:
          Type: HttpApi
          Properties:
            Path: /items
            Method: POST
        GetItem:
          Type: HttpApi
          Properties:
            Path: /items/{id}
            Method: GET

  ItemsFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ItemsFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref ItemsTable
  FunctionName:
    Value: !Ref ItemsFunction
